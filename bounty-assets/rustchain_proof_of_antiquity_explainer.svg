<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1017"/>
      <stop offset="1" stop-color="#182332"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <style>
      .title { font: 800 70px system-ui, -apple-system, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 30px system-ui, -apple-system, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .kicker { font: 800 26px system-ui, -apple-system, Segoe UI, Arial, sans-serif; letter-spacing: 2px; fill: #fbbf24; }
      .h2 { font: 800 34px system-ui, -apple-system, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .body { font: 500 25px system-ui, -apple-system, Segoe UI, Arial, sans-serif; fill: #dbe4ee; }
      .small { font: 500 20px system-ui, -apple-system, Segoe UI, Arial, sans-serif; fill: #aebccc; }
      .mono { font: 700 27px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e2e8f0; }
      .num { font: 900 40px system-ui, -apple-system, Segoe UI, Arial, sans-serif; fill: #111827; }
      .card { fill: #111a25; stroke: #334155; stroke-width: 2; rx: 26; filter: url(#shadow); }
      .arrow { stroke: #f59e0b; stroke-width: 5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <circle cx="1050" cy="100" r="220" fill="#f59e0b" opacity="0.08"/>
  <circle cx="120" cy="1360" r="270" fill="#38bdf8" opacity="0.06"/>

  <text x="80" y="90" class="kicker">RUSTCHAIN · PROOF OF ANTIQUITY</text>
  <text x="80" y="170" class="title">Older silicon.</text>
  <text x="80" y="245" class="title">More weight.</text>
  <text x="80" y="300" class="subtitle">A 60-second map of how genuine hardware earns its place.</text>

  <rect x="70" y="365" width="1060" height="205" class="card"/>
  <circle cx="145" cy="440" r="42" fill="url(#accent)"/>
  <text x="132" y="454" class="num">1</text>
  <text x="215" y="425" class="h2">1 CPU = 1 vote</text>
  <text x="215" y="470" class="body">RustChain starts from hardware participation, not how much capital</text>
  <text x="215" y="505" class="body">you can stake or how much raw compute you can buy.</text>
  <text x="215" y="542" class="small">Project docs describe hardware age/antiquity as a reward-weighting signal.</text>

  <path d="M600 575 L600 620" class="arrow"/>

  <rect x="70" y="630" width="1060" height="290" class="card"/>
  <circle cx="145" cy="705" r="42" fill="url(#accent)"/>
  <text x="130" y="719" class="num">2</text>
  <text x="215" y="690" class="h2">Prove the machine is real</text>
  <text x="215" y="735" class="body">The project documents six hardware checks used to separate genuine</text>
  <text x="215" y="770" class="body">silicon from virtualized or emulated look-alikes:</text>

  <g transform="translate(210,805)">
    <rect x="0" y="0" width="285" height="42" rx="21" fill="#26374a"/><text x="18" y="29" class="small">Clock / oscillator drift</text>
    <rect x="310" y="0" width="245" height="42" rx="21" fill="#26374a"/><text x="328" y="29" class="small">Cache timing</text>
    <rect x="580" y="0" width="260" height="42" rx="21" fill="#26374a"/><text x="598" y="29" class="small">SIMD identity</text>
    <rect x="0" y="55" width="285" height="42" rx="21" fill="#26374a"/><text x="18" y="84" class="small">Thermal drift entropy</text>
    <rect x="310" y="55" width="310" height="42" rx="21" fill="#26374a"/><text x="328" y="84" class="small">Instruction-path jitter</text>
    <rect x="645" y="55" width="195" height="42" rx="21" fill="#26374a"/><text x="663" y="84" class="small">Anti-emulation</text>
  </g>

  <path d="M600 925 L600 970" class="arrow"/>

  <rect x="70" y="980" width="510" height="280" class="card"/>
  <circle cx="145" cy="1050" r="42" fill="#22c55e"/>
  <text x="130" y="1064" class="num">3</text>
  <text x="215" y="1035" class="h2">Genuine hardware</text>
  <text x="115" y="1110" class="body">Older supported CPUs receive</text>
  <text x="115" y="1145" class="body">higher base antiquity multipliers.</text>
  <text x="115" y="1195" class="small">Example in project docs: PowerPC G4</text>
  <text x="115" y="1226" class="small">has a 2.5× base multiplier before decay.</text>

  <rect x="620" y="980" width="510" height="280" class="card"/>
  <circle cx="695" cy="1050" r="42" fill="#ef4444"/>
  <text x="680" y="1064" class="num">✕</text>
  <text x="765" y="1035" class="h2">VM / emulator</text>
  <text x="665" y="1110" class="body">Virtualized look-alikes are detected</text>
  <text x="665" y="1145" class="body">and heavily penalized by the system.</text>
  <text x="665" y="1195" class="small">The goal: reward old physical silicon,</text>
  <text x="665" y="1226" class="small">not a farm pretending to be old hardware.</text>

  <rect x="70" y="1310" width="1060" height="130" rx="30" fill="url(#accent)" filter="url(#shadow)"/>
  <text x="110" y="1365" style="font:800 30px system-ui, sans-serif; fill:#111827;">START HERE</text>
  <text x="330" y="1367" class="mono">pip install clawrtc</text>
  <text x="110" y="1410" style="font:600 22px system-ui, sans-serif; fill:#1f2937;">Then follow the current miner setup at rustchain.org / Scottcjn/Rustchain</text>

  <text x="80" y="1475" class="small">Source-checked against RustChain project documentation · visual prepared by DACH Signal</text>
</svg>
